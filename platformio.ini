; manet-fw — firmware di registrazione per Heltec Wireless Tracker V1.1
;
; La piattaforma ufficiale espressif32 è ferma al core Arduino 2.x: per il
; core 3.x (ESP-IDF 5) si usa il fork pioarduino.

[platformio]
default_envs = tracker

[env:tracker]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = heltec_wireless_tracker
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -I include
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
lib_deps =
    lovyan03/LovyanGFX@^1.2.0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I include
    -Wall
    -Wextra
    -Werror
    -DUNITY_INCLUDE_DOUBLE
